<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簡家荔枝園｜農遊太平～荔枝採果趣 線上報名</title>
<meta name="description" content="台中太平簡家荔枝園採果體驗線上報名。Lychee picking at the Jian Family Lychee Orchard, Taiping, Taichung.">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --cream: #FAF3E8; --paper: #FFFBF4; --red: #B8432F; --red-dark: #8E2F20; --red-soft: #F6E1D9;
    --leaf: #5E7F35; --leaf-dark: #3F5A21; --leaf-soft: #E7EEDB; --ink: #3E2A1C; --muted: #7A6553;
    --line: #E6D9C6; --gold: #C99A3B; --danger: #C0392B;
    /* 全站（中、英、日）都用霞鶩文楷；載入失敗時退回系統字體 */
    --serif: "LXGW WenKai TC", "Microsoft JhengHei", "PingFang TC", "Hiragino Sans", serif;
    --sans: "LXGW WenKai TC", "Microsoft JhengHei", "PingFang TC", "Hiragino Sans", Arial, sans-serif;
    --type: "Special Elite", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--sans); background: var(--cream); color: var(--ink); line-height: 1.75; -webkit-text-size-adjust: 100%; }
  img { max-width: 100%; display: block; }
  a { color: var(--red); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .serif { font-family: var(--serif); }
  .type { font-family: var(--type); letter-spacing: .02em; }
  h2.sec { font-family: var(--serif); font-size: 24px; margin: 0 0 6px; color: var(--ink); }
  .sec-sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  section { padding: 56px 0; }

  /* 語言切換 */
  .lang { position: fixed; top: 12px; right: 12px; z-index: 50; display: flex; background: rgba(255,251,244,.94); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang button { border: 0; background: none; font: 500 13px var(--sans); color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .lang button.on { background: var(--red); color: #fff; }

  /* 照片佔位（之後換成真的照片） */
  .ph { position: relative; overflow: hidden; background: var(--leaf-soft); color: var(--leaf-dark); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; }
  .ph::after { content: attr(data-label); padding: 6px 10px; border: 1.5px dashed currentColor; border-radius: 6px; background: rgba(255,255,255,.6); max-width: 80%; }
  .ph.has-img::after { display: none; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* 1. 主視覺 */
  .hero { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; color: #fff; }
  .hero .bg { position: absolute; inset: -8% 0 0 0; background: var(--red-dark); will-change: transform; }
  .hero .bg.ph { color: var(--red-soft); }
  .hero .bg.ph::after { background: rgba(0,0,0,.18); }
  .hero .bg img { object-position: 35% 40%; }
  .hero .bg img:not([src]) { display: none; }
  .hero .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(35,18,8,.88) 0%, rgba(35,18,8,.6) 35%, rgba(35,18,8,0) 70%); }
  .hero .inner { text-shadow: 0 1px 8px rgba(0,0,0,.45); }
  .hero .inner { position: relative; padding: 0 16px 56px; max-width: 720px; margin: 0 auto; width: 100%; }
  .hero .kicker { font-family: var(--type); font-size: 14px; opacity: .9; }
  .hero h1 { font-family: var(--serif); font-size: clamp(34px, 9vw, 52px); line-height: 1.2; margin: 6px 0 8px; }
  .hero .tag { font-family: var(--serif); font-size: 18px; margin: 0 0 22px; opacity: .95; }
  .hero .event { display: inline-block; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 4px 14px; font-size: 14px; margin-bottom: 18px; }
  .btn { display: inline-block; border: 0; border-radius: 999px; padding: 13px 28px; font: 700 17px var(--sans); cursor: pointer; text-decoration: none; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: var(--red-dark); }
  .btn-ghost { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
  .hero .btn-red { background: #fff; color: var(--red); }
  .scroll-cue { display: block; margin-top: 26px; font-size: 13px; opacity: .85; }
  .scroll-cue span { display: inline-block; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }

  /* 2. 故事開場 */
  .intro-quote { font-family: var(--serif); font-size: 20px; line-height: 1.8; text-align: center; margin: 0 auto; max-width: 560px; }

  /* 3. 明信片 */
  .postcard { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 10px 28px rgba(62,42,28,.12); display: grid; grid-template-columns: 1fr; margin: 0 0 40px; }
  .postcard .photo { aspect-ratio: 3 / 4; max-height: 70vh; }
  .postcard .text { padding: 22px 20px 20px; display: flex; flex-direction: column; }
  .postcard .gen { font-family: var(--type); color: var(--red); font-size: 14px; }
  .postcard h3 { font-family: var(--serif); font-size: 21px; margin: 4px 0 10px; }
  .postcard p { margin: 0 0 12px; font-size: 15.5px; }
  .postcard .stamp { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line); font-family: var(--type); font-size: 13px; color: var(--muted); white-space: pre-line; line-height: 1.6; }
  @media (min-width: 640px) {
    .postcard { grid-template-columns: 1fr 1fr; }
    .postcard .photo { aspect-ratio: auto; min-height: 420px; max-height: none; }
    .postcard:nth-of-type(even) .photo { order: 2; }
    .postcard .text { padding: 32px 28px 24px; }
  }
  .closing { font-family: var(--serif); text-align: center; font-size: 18px; color: var(--leaf-dark); margin: 8px auto 0; max-width: 520px; }

  /* 4. 走進果園（捲動入園） */
  .path { position: relative; padding-left: 28px; }
  .path::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; border-left: 3px dotted var(--leaf); }
  .stop { position: relative; margin-bottom: 34px; }
  .stop::before { content: ""; position: absolute; left: -27px; top: 6px; width: 15px; height: 15px; border-radius: 50%; background: var(--cream); border: 3px solid var(--leaf); }
  .stop .lbl { font-family: var(--type); color: var(--leaf-dark); font-size: 14px; }
  .stop h3 { font-family: var(--serif); margin: 2px 0 10px; font-size: 19px; }
  .stop .ph { aspect-ratio: 16 / 10; border-radius: 10px; }
  .stop p { color: var(--muted); font-size: 15px; margin: 10px 0 0; }

  /* 5. 活動資訊卡 */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .icard { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .icard .k { font-size: 13px; color: var(--muted); }
  .icard .v { font-family: var(--serif); font-size: 18px; margin-top: 2px; }
  .icard .v small { display: block; font-family: var(--sans); font-size: 13px; color: var(--muted); }
  .fraud { background: #FFF4D6; border: 1.5px solid #E5B24A; color: #7A4B00; border-radius: 10px; padding: 12px 14px; font-size: 14.5px; margin-top: 14px; }

  /* 6. 交通 */
  .tlist { display: grid; gap: 10px; margin-top: 14px; }
  .titem { display: grid; grid-template-columns: 34px 1fr; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .titem .ic { font-size: 22px; line-height: 1.2; }
  .titem b { display: block; font-family: var(--serif); }
  .titem span { color: var(--muted); font-size: 14.5px; }
  .todo { color: #A0522D; background: #FFF0E6; border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .map { aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-top: 14px; }
  .map iframe { width: 100%; height: 100%; border: 0; }

  /* 7. Google 評價 */
  .rating { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .rating .num { font-family: var(--serif); font-size: 40px; }
  .stars { color: var(--gold); letter-spacing: 2px; font-size: 20px; }
  .reviews { display: grid; gap: 12px; }
  .review { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .review .who { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* 8. 報名表 */
  .booking { background: var(--paper); border-top: 6px solid var(--red); }
  .step { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
  .step h3 { margin: 0 0 12px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .step h3 .n { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #fff; align-items: center; justify-content: center; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .opt { border: 2px solid var(--line); border-radius: 12px; padding: 10px; background: #fff; font: 500 15px var(--sans); color: var(--ink); cursor: pointer; text-align: center; }
  .opt small { display: block; color: var(--muted); margin-top: 3px; font-size: 13px; font-weight: 400; }
  .opt.sel { border-color: var(--red); background: var(--red-soft); }
  .opt:disabled { cursor: not-allowed; color: #B7AA9C; background: #F7F2EA; border-color: #EFE6D8; }
  .opt:disabled small { color: #B7AA9C; }
  .few small { color: var(--danger); font-weight: 700; }
  .tk { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F3EADC; }
  .tk:last-child { border-bottom: 0; }
  .desc { color: var(--muted); font-size: 13px; }
  .stepper { display: flex; align-items: center; }
  .stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--red); background: #fff; color: var(--red); font-size: 20px; cursor: pointer; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper span { display: inline-block; width: 34px; text-align: center; font-size: 18px; }
  label.f { display: block; margin: 12px 0 4px; font-size: 14px; }
  input.f { width: 100%; padding: 11px 12px; font-size: 16px; border: 1px solid #D9CBB7; border-radius: 10px; background: #fff; color: var(--ink); }
  input.f:focus { outline: 2px solid var(--red-soft); border-color: var(--red); }
  .sum { position: sticky; bottom: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 12px 16px; margin-top: 12px; box-shadow: 0 -6px 20px rgba(62,42,28,.08); }
  .sum .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .sum .total b { color: var(--red); font-size: 22px; }
  .sum .btn { width: 100%; margin-top: 10px; }
  .btn:disabled { background: #D9CDBE !important; color: #fff !important; cursor: not-allowed; }
  .msg { margin-top: 8px; color: var(--danger); font-weight: 700; font-size: 14px; }
  .banner { padding: 10px 14px; border-radius: 10px; background: #FFF4D6; color: #7A4B00; font-weight: 700; margin-bottom: 8px; }
  .notice { background: #fff; border-left: 5px solid var(--leaf); padding: 12px 14px; white-space: pre-line; border-radius: 0 10px 10px 0; font-size: 15px; }

  /* 9. 常見問題 */
  details { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 500; }
  details p { margin: 10px 0 0; color: var(--muted); }
  .faq-cat { font-family: var(--serif); font-size: 17px; color: var(--leaf-dark); margin: 22px 0 10px; }
  .faq-cat:first-child { margin-top: 0; }
  /* 常見問題：先只顯示綠色分類標題，點開才看到該類的問題 */
  details.faq-group { background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0; margin: 0; }
  details.faq-group > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 14px 2px;
    font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--leaf-dark); }
  details.faq-group > summary::-webkit-details-marker { display: none; }
  details.faq-group > summary .n { font-size: 13px; font-weight: 400; color: var(--muted); }
  details.faq-group > summary::after { content: '＋'; margin-left: auto; font-size: 18px; color: var(--leaf-dark); }
  details.faq-group[open] > summary::after { content: '－'; }
  details.faq-group > .faq-body { padding: 0 0 12px; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 36px 16px 120px; line-height: 2; }

  /* 確認視窗 */
  .modal { position: fixed; inset: 0; background: rgba(40,25,15,.55); display: none; align-items: flex-end; justify-content: center; z-index: 60; }
  .modal.open { display: flex; }
  .sheet { background: var(--paper); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 20px 18px 24px; max-height: 90vh; overflow: auto; }
  @media (min-width: 640px) { .modal { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h3 { font-family: var(--serif); margin: 0 0 12px; font-size: 20px; }
  .sheet table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .sheet td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .sheet td:first-child { color: var(--muted); width: 32%; }
  .sheet .acts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 16px; }

  /* 載入 */
  #loading { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); }
  .spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--red-soft); border-top-color: var(--red); animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* 捲動浮現 */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .scroll-cue span, .spin { animation: none; } html { scroll-behavior: auto; } }

  .preview-bar { background: #2F2A24; color: #F4E9D8; font-size: 13px; text-align: center; padding: 6px 12px; }
  body.is-preview .lang { top: 58px; }
</style>
</head>
<body>
<div id="previewBar" class="preview-bar" style="display:none"></div>
<div class="lang" role="group" aria-label="Language">
  <button data-l="zh">中文</button><button data-l="en">EN</button><button data-l="ja">日本語</button>
</div>

<div id="loading"><div class="spin"></div><div data-t="loading"></div></div>

<div id="app" style="display:none">
  <!-- ===== 入口：只有一般報名會顯示；修改／取消模式會略過 ===== -->
  <div id="intro">
    <header class="hero">
      <div class="bg ph has-img" id="heroBg"><img id="heroImg" alt="結實纍纍的荔枝樹" decoding="async" fetchpriority="high"></div>
      <div class="shade"></div>
      <div class="inner">
        <div class="kicker">Taiping, Taichung · Three generations</div>
        <h1 data-t="orchard"></h1>
        <p class="tag" data-t="tagline"></p>
        <div class="event" id="eventName"></div><br>
        <a class="btn btn-red" href="#booking" data-t="bookNow"></a>
        <span class="scroll-cue"><span>↓</span> <i data-t="scrollCue"></i></span>
      </div>
    </header>

    <section>
      <div class="wrap reveal"><p class="intro-quote" data-t="introQuote"></p></div>
    </section>

    <section style="padding-top:0">
      <div class="wrap" id="postcards"></div>
      <div class="wrap reveal"><p class="closing" data-t="closing"></p></div>
    </section>

    <section style="background:var(--paper)">
      <div class="wrap">
        <h2 class="sec reveal" data-t="walkTitle"></h2>
        <p class="sec-sub reveal" data-t="walkSub"></p>
        <div class="path" id="path"></div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="sec reveal" data-t="infoTitle"></h2>
        <p class="sec-sub reveal" data-t="infoSub"></p>
        <div class="cards reveal" id="infoCards"></div>
        <div class="fraud reveal" id="fraudTop"></div>
      </div>
    </section>

    <section style="background:var(--paper)">
      <div class="wrap">
        <h2 class="sec reveal" data-t="trafficTitle"></h2>
        <p class="sec-sub reveal" id="address"></p>
        <a class="btn btn-ghost reveal" id="navBtn" target="_blank" rel="noopener" data-t="navigate"></a>
        <div class="map reveal" id="map"></div>
        <div class="tlist reveal" id="traffic"></div>
      </div>
    </section>

    <section id="reviewsSec">
      <div class="wrap">
        <h2 class="sec reveal" data-t="reviewsTitle"></h2>
        <div class="rating reveal"><span class="num" id="ratingNum">–</span><span><span class="stars" id="ratingStars">★★★★★</span><br><span class="desc" id="ratingCount"></span></span></div>
        <div class="reviews reveal" id="reviews"></div>
        <p class="reveal" style="margin-top:14px"><a class="btn btn-ghost" id="reviewsBtn" target="_blank" rel="noopener" data-t="allReviews"></a></p>
      </div>
    </section>
  </div>

  <!-- ===== 報名表 ===== -->
  <section class="booking" id="booking">
    <div class="wrap">
      <h2 class="sec" id="formTitle" data-t="formTitle"></h2>
      <div id="banner" class="banner" style="display:none"></div>
      <div id="notice" class="notice" style="display:none"></div>
      <div class="step"><h3><span class="n">1</span><span data-t="pickDate"></span></h3><div id="dates" class="grid"></div></div>
      <div class="step"><h3><span class="n">2</span><span data-t="pickTime"></span></h3><div id="slots" class="grid"></div></div>
      <div class="step"><h3><span class="n">3</span><span data-t="pickPeople"></span></h3><div id="tickets"></div></div>
      <div class="step"><h3><span class="n">4</span><span data-t="contact"></span></h3>
        <label class="f" for="name" data-t="name"></label><input class="f" id="name" autocomplete="name">
        <label class="f" for="phone" data-t="phone"></label><input class="f" id="phone" type="tel" autocomplete="tel" inputmode="tel">
        <label class="f" for="email" data-t="email"></label><input class="f" id="email" type="email" autocomplete="email">
        <!-- 擋機器人：這一格真人看不到也不會填，有填的就是機器人 -->
        <input id="hp" name="hp_note" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      </div>
      <div class="sum">
        <div class="row"><span class="desc" id="picked"></span><span class="total" id="total"></span></div>
        <button id="submit" class="btn btn-red" data-t="next"></button>
        <div id="msg" class="msg"></div>
      </div>
      <div id="cancelBox" class="step" style="display:none">
        <h3 data-t="cantCome"></h3>
        <p class="desc" data-t="cancelWarn"></p>
        <button id="cancelBtn" class="btn btn-ghost" style="width:100%;color:var(--danger);border-color:var(--danger)" data-t="cancelThis"></button>
      </div>
    </div>
  </section>

  <section id="faqSec">
    <div class="wrap">
      <h2 class="sec reveal" data-t="faqTitle"></h2>
      <div id="faq"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<!-- 送出前確認 -->
<div class="modal" id="confirm" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
  <div class="sheet">
    <h3 id="cfTitle" data-t="confirmTitle"></h3>
    <table id="cfTable"></table>
    <div class="fraud" id="cfFraud"></div>
    <div class="acts">
      <button class="btn btn-ghost" id="cfBack" data-t="back"></button>
      <button class="btn btn-red" id="cfGo" data-t="confirmSend"></button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   報名頁（新版）：入口故事＋捲動入園＋活動資訊＋交通＋評價＋報名表＋常見問題
   - 在 Apps Script 裡執行時呼叫後端；在電腦上單獨打開時用「預覽資料」
   - 三語：中文（預設）、English、日本語
   ===================================================================== */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
/* 這個檔案有三種用法：
   1. 放在 Apps Script 裡（IS_GAS）：直接呼叫後端
   2. 放在 GitHub Pages（IS_API）：用網路連到下面這個 Apps Script 網址，由它讀寫試算表
   3. 在自己電腦上打開：用範例資料預覽，不會真的報名（網址加 ?live=1 可改連真的後台）
   ※ 如果 Apps Script 重新「建立新的部署」而換了網址，要把下面這行改成新網址（「管理部署 → 編輯 → 新版本」不會換網址） */

/* ---------- 共用小工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = (fn, ...args) => {
  if (IS_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if (!IS_API) return MOCK[fn](...args);
  // 用 text/plain 送出，瀏覽器才不會先發一次「預檢」請求（Apps Script 不支援預檢）
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(r => r.json())
    .then(j => { if (j.error) throw new Error(j.error); return j.result; });
};
const params = () => new Promise(r => IS_GAS ? google.script.url.getLocation(l => r(l.parameter || {})) : r(Object.fromEntries(new URLSearchParams(location.search))));

let LANG = 'zh';
const t = (k, v) => { let s = (TXT[LANG] && TXT[LANG][k]) || TXT.zh[k] || k; if (v) Object.keys(v).forEach(x => s = s.split('{' + x + '}').join(v[x])); return s; };
const L = obj => obj ? (obj[LANG] || obj.zh) : '';
const tName = n => (TICKET_NAME[n] && TICKET_NAME[n][LANG]) || n;
const tDesc = d => (TICKET_DESC[d] && TICKET_DESC[d][LANG]) || d;
function fmtDay(ymd, withYear) {
  const p = ymd.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]), w = d.getDay();
  if (LANG === 'en') return `${WEEK.en[w]}, ${MON_EN[p[1] - 1]} ${p[2]}${withYear ? ', ' + p[0] : ''}`;
  return `${withYear ? p[0] + '/' : ''}${p[1]}/${p[2]}（${(LANG === 'ja' ? WEEK.ja : WEEK.zh)[w]}）`;
}
const detailText = c => D.tickets.filter(x => c[x.name] > 0).map(x => tName(x.name) + ' ' + c[x.name]).join(LANG === 'en' ? ', ' : '、');

/* ---------- 狀態 ---------- */
let D = null, P = {}, MODE = 'book', B = null, selDate = null, selKey = null, counts = {}, timer = null, cancelArmed = false;

/* ---------- 啟動 ---------- */
async function boot() {
  P = await params();
  let saved = null; try { saved = localStorage.getItem('lang'); } catch (e) {}
  LANG = ['zh', 'en', 'ja'].includes(P.lang) ? P.lang : (['zh', 'en', 'ja'].includes(saved) ? saved : 'zh');
  applyLang();
  if (!IS_GAS && !IS_API) { document.body.classList.add('is-preview'); $('previewBar').style.display = ''; $('previewBar').textContent = '預覽模式：使用範例資料，不會真的報名。照片位置以虛線框表示。'; }
  try {
    // 從信件連結進來（有 t）時，頁面資料和這筆報名同時去要，不用等完一個再等一個
    const bkReq = P.t ? api('getBooking', P.t) : null;
    if (bkReq) bkReq.catch(() => {});
    D = await api('getPageData');
    if (IS_API) D.info.baseUrl = location.origin + location.pathname;   // 「回到報名頁」回到這個網頁本身
    D.tickets.forEach(x => counts[x.name] = 0);
    if (bkReq) {
      const bk = await bkReq;
      return initEdit(bk);
    }
    MODE = 'book';
    show();
  } catch (e) { $('loading').lastElementChild.textContent = t('loadFail') + (e && e.message || e); }
}

function show() {
  renderAll();
  $('loading').style.display = 'none'; $('app').style.display = '';
  timer = setInterval(refresh, 30000);
  observe();
}

/* ---------- 語言 ---------- */
function applyLang() {
  document.documentElement.lang = { zh: 'zh-Hant', en: 'en', ja: 'ja' }[LANG];
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  if (D) renderAll();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  LANG = b.dataset.l; try { localStorage.setItem('lang', LANG); } catch (e) {}
  applyLang();
});

/* ---------- 畫面 ---------- */
function renderAll() {
  renderStatic();
  if (MODE === 'done' || MODE === 'end') return;
  renderBanner(); renderDates(); renderSlots(); renderTickets(); renderTotal();
}

/* ---------- 網頁內容：有「網頁內容」分頁就用試算表的，沒有就用上面的內建文字 ---------- */
function defaultContent() {
  const c = {}, set = (k, zh, en, ja) => c[k] = { zh: zh || '', en: en || '', ja: ja || '' };
  ['orchard', 'tagline', 'introQuote', 'closing'].forEach(k => set({ orchard: '園區名稱', tagline: '標語', introQuote: '開場句', closing: '結語' }[k], TXT.zh[k], TXT.en[k], TXT.ja[k]));
  set('主視覺小字', 'Taiping, Taichung · Three generations');
  STORY.forEach((s, i) => { const n = i + 1;
    set(`故事${n}_標籤`, s.gen, s.genEn, s.genJa); set(`故事${n}_標題`, s.zh.h, s.en.h, s.ja.h);
    set(`故事${n}_內文`, s.zh.p.join('\n'), s.en.p.join('\n'), s.ja.p.join('\n')); set(`故事${n}_郵戳`, s.stamp); });
  PATH.forEach((s, i) => { set(`入園${i + 1}_標題`, s.zh[0], s.en[0], s.ja[0]); set(`入園${i + 1}_說明`, s.zh[1], s.en[1], s.ja[1]); });
  const tk = { tAddr: '交通_導航', tPark: '交通_停車', tBus: '交通_公車' };
  TRAFFIC.forEach(x => set(tk[x.k], x.v.zh, x.v.en, x.v.ja));
  return c;
}
let CONTENT = null;
const CT = k => { const v = CONTENT[k]; return v ? (v[LANG] || v.zh || '') : ''; };     // 英日沒填就顯示中文
const I = k => (D.info.i18n && D.info.i18n[k] && D.info.i18n[k][LANG]) || D.info[k] || '';  // 基本設定的英日欄
const imgUrl = k => (IS_GAS || IS_API) ?(D.info.images && D.info.images[k] ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(D.info.images[k]) + '&sz=w1600' : '') : (IMG[k] || '');
const photo = (k, label, cls) => { const u = imgUrl(k); return u ? '<div class="' + cls + ' ph has-img"><img src="' + esc(u) + '" alt="" loading="lazy"></div>' : '<div class="' + cls + ' ph" data-label="' + esc(label) + '"></div>'; };

function renderStatic() {
  const i = D.info;
  if (!CONTENT) CONTENT = D.content && Object.keys(D.content).length ? D.content : defaultContent();
  const orchard = CT('園區名稱') || t('orchard');
  document.title = orchard + '｜' + I('活動名稱');
  document.querySelector('.hero h1').textContent = orchard;
  document.querySelector('.hero .tag').textContent = CT('標語');
  document.querySelector('.hero .kicker').textContent = CT('主視覺小字');
  document.querySelector('.intro-quote').textContent = CT('開場句');
  document.querySelector('.closing').textContent = CT('結語');
  $('eventName').textContent = I('活動名稱');
  const hero = imgUrl('主視覺'); if (hero && $('heroImg').getAttribute('src') !== hero) $('heroImg').src = hero;

  $('postcards').innerHTML = [1, 2, 3].filter(n => CT(`故事${n}_標題`)).map(n => `<article class="postcard reveal">
      ${photo('明信片' + n, `照片：網頁_明信片${n}.jpg（直式 3:4）`, 'photo')}
      <div class="text"><div class="gen">${esc(CT(`故事${n}_標籤`))}</div><h3>${esc(CT(`故事${n}_標題`))}</h3>
        ${CT(`故事${n}_內文`).split(/\n+/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('')}
        <div class="stamp">${esc(CT(`故事${n}_郵戳`))}</div></div></article>`).join('');
  $('path').innerHTML = [1, 2, 3].filter(n => CT(`入園${n}_標題`)).map(n => `<div class="stop reveal"><div class="lbl">Stop ${n}</div>
      <h3>${esc(CT(`入園${n}_標題`))}</h3>${photo('入園' + n, `照片：網頁_入園${n}.jpg（橫式）`, '')}<p>${esc(CT(`入園${n}_說明`))}</p></div>`).join('');

  const dates = [...new Set(D.avail.sessions.map(s => s.date))].sort();
  const prices = D.tickets.map(x => `${tName(x.name)} $${x.price}`).join(LANG === 'en' ? ' · ' : '・');
  $('infoCards').innerHTML = [
    [t('kDates'), dates.map(d => fmtDay(d)).join(LANG === 'en' ? ', ' : '、')],
    [t('kFee'), prices],
    [t('kPlace'), I('活動地點名稱')],
    [t('kPay'), I('繳費方式') || t('payCash')]
  ].map(([k, v]) => `<div class="icard"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
  const fraud = t('fraudPrefix') + I('防詐騙提醒');
  $('fraudTop').textContent = fraud; $('cfFraud').textContent = fraud;

  $('address').textContent = I('活動地點名稱');
  $('navBtn').href = i['活動地點地圖連結'];
  $('map').innerHTML = `<iframe loading="lazy" title="map" src="https://www.google.com/maps?q=${encodeURIComponent(i['活動地點名稱'] + ' 太平')}&output=embed"></iframe>`;
  $('traffic').innerHTML = [['🔎', 'tAddr', '交通_導航'], ['🅿️', 'tPark', '交通_停車'], ['🚌', 'tBus', '交通_公車'], ['📍', 'tCheck', '交通_報到地點']]
    .filter(([, , k]) => CT(k)).map(([ic, lk, k]) => `<div class="titem"><div class="ic">${ic}</div><div><b>${esc(t(lk))}</b><span>${esc(CT(k))}</span></div></div>`).join('');

  // 評價：試算表有填星等或評論才顯示；預覽（沒有試算表）顯示待填框
  const usingSheet = D.content && Object.keys(D.content).length;
  const revs = [1, 2, 3].map(n => ({ text: CT(`評價${n}_內容`), who: CT(`評價${n}_暱稱`) })).filter(r => r.text);
  const rating = CT('評價_星等'), rcount = CT('評價_評論數');
  $('reviewsSec').style.display = usingSheet && !rating && !revs.length ? 'none' : '';
  // 試算表會把 5.0 自動變成 5，這裡補回一位小數
  $('ratingNum').textContent = rating ? (isFinite(Number(rating)) ? Number(rating).toFixed(1) : rating) : '–';
  $('ratingCount').innerHTML = rcount ? esc(rcount + ' ' + t('reviewsCount')) : (usingSheet ? '' : '<span class="todo">待填：Google 星等與評論數</span>');
  $('reviews').innerHTML = (revs.length ? revs : usingSheet ? [] : REVIEWS.items.map(r => ({ text: r.text, who: r.who, todo: true })))
    .map(r => `<div class="review"><div class="stars" style="font-size:15px">★★★★★</div><div>${r.todo ? `<span class="todo">${esc(r.text)}</span>` : esc(r.text)}</div>${r.who ? `<div class="who">— ${esc(r.who)}</div>` : ''}</div>`).join('');
  $('reviewsBtn').href = CT('評價_連結') || i['活動地點地圖連結'];

  // 常見問題：試算表「常見問題」分頁（null = 沒有這個分頁 → 用內建題目）
  const faq = D.faq || FAQ.map(f => ({ cat: FAQ_CATS[f.c].zh, q: f.q, a: f.a }));
  const catName = zh => { const k = Object.keys(FAQ_CATS).find(x => FAQ_CATS[x].zh === zh); return k ? L(FAQ_CATS[k]) : zh; };
  const cats = [...new Set(faq.map(f => f.cat))];
  if (MODE === 'book') $('faqSec').style.display = faq.length ? '' : 'none';
  const qa = list => list.map(f => `<details><summary>${esc(L(f.q))}</summary><p>${esc(L(f.a))}</p></details>`).join('');
  $('faq').innerHTML = cats.map(c => {
    const list = faq.filter(f => f.cat === c);
    if (!c) return qa(list);   // 沒填分類的題目直接列出
    return `<details class="faq-group"><summary>${esc(catName(c))}<span class="n">（${list.length}）</span></summary>` +
           `<div class="faq-body">${qa(list)}</div></details>`;
  }).join('');

  $('foot').innerHTML = `${esc(I('主辦單位'))}<br>📍 <a href="${esc(i['活動地點地圖連結'])}" target="_blank" rel="noopener">${esc(t('map'))}</a>　💬 <a href="${esc(i['官方LINE連結'])}" target="_blank" rel="noopener">${esc(t('line'))} ${esc(i['官方LINE ID'])}</a>`;

  if (!$('submit')) return;                     // 結束頁（報名成功、取消完成）沒有表單
  if (I('報名頁備註') && MODE === 'book') {
    $('notice').innerHTML = '📢 ' + esc(I('報名頁備註')) + (i['官方LINE連結'] ? `\n<a href="${esc(i['官方LINE連結'])}" target="_blank" rel="noopener" style="color:#06A34A;font-weight:700">👉 ${esc(t('line'))} ${esc(i['官方LINE ID'])}</a>` : '');
    $('notice').style.display = '';
  }
  if (MODE === 'edit') $('formTitle').textContent = t('editTitle', { id: B.id });
  $('submit').textContent = MODE === 'edit' ? t('saveEdit') : t('next');
}

const sess = key => D.avail.sessions.find(s => s.key === key);
const need = () => D.tickets.reduce((n, x) => n + (x.counts ? counts[x.name] : 0), 0);
const people = () => D.tickets.reduce((n, x) => n + counts[x.name], 0);
const fee = () => D.tickets.reduce((n, x) => n + x.price * counts[x.name], 0);
const showMsg = s => $('msg').textContent = s;

function renderBanner() {
  const st = D.avail.status;
  $('banner').style.display = (B || st === '開放中') ? 'none' : '';
  $('banner').textContent = st === '尚未開放' ? t('notOpen') : t('ended');
  const cur = selKey && sess(selKey);
  if (selKey && (!cur || cur.closed || cur.remain < Math.max(need(), 1))) { selKey = null; showMsg(t('slotChanged')); }
}

function renderDates() {
  const by = {};
  D.avail.sessions.forEach(s => { if (!(s.date in by)) by[s.date] = 0; if (!s.closed) by[s.date] += s.remain; });
  $('dates').innerHTML = Object.keys(by).sort().map(d => {
    const r = by[d];
    return `<button class="opt ${d === selDate ? 'sel' : ''}" ${r > 0 ? '' : 'disabled'} data-date="${esc(d)}">${esc(fmtDay(d))}<small>${r > 0 ? esc(t('left', { n: r })) : esc(t('fullOrClosed'))}</small></button>`;
  }).join('');
}

function renderSlots() {
  if (!selDate) { $('slots').innerHTML = `<span class="desc">${esc(t('selectDateFirst'))}</span>`; return; }
  const n = Math.max(need(), 1);
  $('slots').innerHTML = D.avail.sessions.map((s, i) => {
    if (s.date !== selDate) return '';
    let sub, ok = false;
    if (s.closed) sub = t('closed');
    else if (s.remain === 0) sub = t('full');
    else if (s.remain < n) sub = t('notEnough', { n: s.remain, m: n });
    else { sub = t('left', { n: s.remain }); ok = true; }
    return `<button class="opt ${ok && s.remain <= 5 ? 'few' : ''} ${s.key === selKey ? 'sel' : ''}" ${ok ? '' : 'disabled'} data-slot="${i}">${esc(s.time)}<small>${esc(sub)}</small>${s.note ? '<small>' + esc(s.note) + '</small>' : ''}</button>`;
  }).join('');
}

function renderTickets() {
  const max = Number(D.info['每筆報名人數上限']) || Infinity;
  const cur = selKey ? sess(selKey) : null;
  $('tickets').innerHTML = D.tickets.map((x, i) => {
    const plusOk = people() < max && !(x.counts && cur && need() >= cur.remain);
    return `<div class="tk"><div>${esc(tName(x.name))}　<b>$${x.price}</b>
        <div class="desc">${esc(tDesc(x.desc))}${x.counts ? '' : esc(t('noSeat'))}</div></div>
      <div class="stepper"><button data-chg="${i}" data-d="-1" ${counts[x.name] > 0 ? '' : 'disabled'} aria-label="−">−</button>
        <span aria-live="polite">${counts[x.name]}</span>
        <button data-chg="${i}" data-d="1" ${plusOk ? '' : 'disabled'} aria-label="+">＋</button></div></div>`;
  }).join('') + (max < Infinity ? `<div class="desc" style="margin-top:6px">${esc(t('maxPer', { n: max }))}</div>` : '');
}

function renderTotal() {
  const s = selKey ? sess(selKey) : null;
  $('picked').textContent = s ? t('pickedTpl', { d: fmtDay(s.date), t: s.time }) : t('noSlot');
  $('total').innerHTML = `${esc(detailText(counts) || t('noPeople'))}　${esc(t('totalTpl'))} <b>$${fee()}</b>`;
  $('submit').disabled = !((B || D.avail.status === '開放中') && s && need() > 0);
}

/* ---------- 操作 ---------- */
// 頁內連結（例如「立即報名」）：Apps Script 的網頁預設把連結開在最外層視窗，這裡改成在頁面內捲動
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const el = document.getElementById(a.getAttribute('href').slice(1));
  if (el) { e.preventDefault(); el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); }
});
document.addEventListener('click', e => {
  const d = e.target.closest('[data-date]'); if (d && !d.disabled) { selDate = d.dataset.date; selKey = null; showMsg(''); renderAll(); $('slots').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const s = e.target.closest('[data-slot]'); if (s && !s.disabled) { selKey = D.avail.sessions[+s.dataset.slot].key; showMsg(''); renderAll(); return; }
  const c = e.target.closest('[data-chg]'); if (c && !c.disabled) { const x = D.tickets[+c.dataset.chg]; counts[x.name] = Math.max(0, counts[x.name] + Number(c.dataset.d)); renderAll(); }
});

function refresh() {
  if (MODE !== 'book' && MODE !== 'edit') return;
  api('getAvailability').then(a => { D.avail = adj(a); renderAll(); }).catch(() => {});
}
function adj(avail) { if (B) avail.sessions.forEach(s => { if (s.key === B.key && !s.closed) s.remain += B.need; }); return avail; }

function form() { return { key: selKey, name: $('name').value, phone: $('phone').value, email: $('email').value, counts: counts, lang: LANG,
                           hp: $('hp').value, el: Date.now() - T0 }; }   // hp、el：擋機器人用（見下方隱藏欄位）

/* 前端先做簡單檢查，送出後後端還會再檢查一次 */
function checkForm(f) {
  if (!f.name.trim()) return { zh: '請填寫姓名', en: 'Enter your name', ja: 'お名前を入力してください' }[LANG];
  if (!/^09\d{8}$/.test(f.phone.replace(/\D/g, ''))) return { zh: '手機號碼格式不正確（例：0912345678）', en: 'Enter a Taiwan mobile number, like 0912345678', ja: '携帯番号の形式が正しくありません（例：0912345678）' }[LANG];
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) return { zh: 'Email 格式不正確', en: 'Enter a valid email', ja: 'メールアドレスの形式が正しくありません' }[LANG];
  return '';
}

$('submit').onclick = () => {
  const f = form(), err = checkForm(f);
  if (err) return showMsg(err);
  showMsg('');
  const s = sess(selKey);
  const rows = [[t('cDate'), fmtDay(s.date, true)], [t('cTime'), s.time], [t('cPeople'), detailText(counts)], [t('cFee'), '$' + fee() + '（' + t('payCash') + '）'], [t('cName'), f.name], [t('cPhone'), f.phone], [t('cEmail'), f.email]];
  $('cfTable').innerHTML = rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  $('confirm').classList.add('open');
  $('cfGo').focus();
};
$('cfBack').onclick = () => $('confirm').classList.remove('open');
$('confirm').addEventListener('click', e => { if (e.target === $('confirm')) $('confirm').classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('confirm').classList.remove('open'); });

$('cfGo').onclick = () => {
  const go = $('cfGo'); go.disabled = true; go.textContent = t('sending');
  const f = form();
  (B ? api('updateBooking', P.t, f) : api('submitBooking', f)).then(r => {
    go.disabled = false; go.textContent = t('confirmSend'); $('confirm').classList.remove('open');
    if (r.ok) return showDone(r);
    if (r.refresh) refresh(); else renderAll();
    showMsg(r.msg);
  }).catch(e => { go.disabled = false; go.textContent = t('confirmSend'); $('confirm').classList.remove('open'); showMsg(t('netErr') + (e && e.message || e)); });
};

/* ---------- 結束頁（報名成功、取消完成…）：只留一張卡片 ---------- */
function endPage(title, body) {
  clearInterval(timer); MODE = 'end';
  $('intro').style.display = 'none'; $('faqSec').style.display = 'none';
  $('booking').innerHTML = `<div class="wrap"><div class="step" style="margin-top:40px"><h3 style="font-family:var(--serif);font-size:21px;color:var(--red)">${title}</h3>${body}</div>
    <div class="fraud">${esc(t('fraudPrefix') + I('防詐騙提醒'))}</div></div>`;
  $('loading').style.display = 'none'; $('app').style.display = '';
  window.scrollTo(0, 0);
}

function showDone(r) {
  endPage(esc(B ? t('editDoneTitle') : t('doneTitle')),
    `<p>${esc(t('bookingNo'))}：<b style="font-size:20px">${esc(r.id)}</b></p>
     <p>${esc(r.dateText)} ${esc(r.time)}<br>${esc(detailText(counts))}　${esc(t('totalTpl'))} <b style="color:var(--red)">$${r.fee}</b></p>
     <p class="desc">${esc(r.mailOk ? t('mailSent', { e: r.email }) : t('mailLater'))}</p>
     ${r.dupWarn ? `<p class="msg">${esc(t('dupWarn'))}</p>` : ''}
     <p><b>${esc(t('screenshot'))}</b></p>`);
}

/* ---------- 修改／取消模式：略過入口，直接到表單 ---------- */
function initEdit(bk) {
  if (!bk.found || bk.status !== '有效' || !bk.editable) {
    const why = !bk.found ? t('notFound') : bk.status !== '有效' ? t('alreadyCancelled', { id: bk.id }) : t('tooLate', { id: bk.id });
    return endPage(esc(t('cannotEdit')), `<p>${esc(why)}</p><p><a href="${esc(D.info.baseUrl)}">${esc(t('backHome'))}</a></p>`);
  }
  B = bk;
  if (P.a === 'cancel' || bk.canModify === false) return cancelOnly(bk);
  MODE = 'edit';
  D.avail = adj(D.avail);
  selDate = bk.date; selKey = bk.key;
  D.tickets.forEach(x => counts[x.name] = bk.counts[x.name] || 0);
  $('name').value = bk.name; $('phone').value = bk.phone; $('email').value = bk.email;
  $('intro').style.display = 'none'; $('faqSec').style.display = 'none'; $('notice').style.display = 'none';
  $('cancelBox').style.display = '';
  show();
  $('booking').scrollIntoView();
}

function cancelOnly(bk) {
  D.tickets.forEach(x => counts[x.name] = bk.counts[x.name] || 0);
  endPage(esc(t('cancelTitle', { id: bk.id })),
    `<p>${esc(fmtDay(bk.date, true))} ${esc(bk.time)}<br>${esc(detailText(counts))}</p>
     ${bk.canModify === false ? `<p class="msg" style="color:#8A5A00">${esc(t('lockedNote'))}</p>` : ''}
     <p class="desc">${esc(t('cancelWarn'))}${esc(t('cancelOnlyNote'))}</p>
     <button id="cancelBtn" class="btn btn-ghost" style="width:100%;color:var(--danger);border-color:var(--danger)">${esc(t('cancelThis'))}</button>
     <div id="msg" class="msg"></div>`);
  $('cancelBtn').onclick = askCancel;
}

function askCancel() {
  const btn = $('cancelBtn');
  if (!cancelArmed) { cancelArmed = true; btn.textContent = t('cancelSure'); btn.style.background = 'var(--danger)'; btn.style.color = '#fff'; return; }
  btn.disabled = true; btn.textContent = t('processing');
  api('cancelBooking', P.t, LANG).then(r => {
    if (!r.ok) { cancelArmed = false; btn.disabled = false; btn.textContent = t('cancelThis'); btn.style.background = ''; btn.style.color = 'var(--danger)'; return showMsg(r.msg); }
    endPage(esc(t('cancelledTitle')),
      `<p>${esc(t('cancelledBody', { id: r.id, d: r.dateText, t: r.time }))}</p>
       <p class="desc">${esc(r.mailOk ? t('cancelMailSent', { e: r.email }) : t('cancelMailLater'))}</p>
       <p><a href="${esc(D.info.baseUrl)}">${esc(t('rebook'))}</a></p>`);
  }).catch(e => { cancelArmed = false; btn.disabled = false; btn.textContent = t('cancelThis'); showMsg(t('netErr') + (e && e.message || e)); });
}
$('cancelBtn').onclick = askCancel;

/* ---------- 捲動效果：內容浮現＋主視覺慢速移動 ---------- */
function observe() {
  const els = document.querySelectorAll('.reveal:not(.in)');
  if (!('IntersectionObserver' in window)) return els.forEach(el => el.classList.add('in'));
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: 0.15 });
  els.forEach(el => io.observe(el));
}
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let ticking = false;
window.addEventListener('scroll', () => {
  if (reduce || ticking) return; ticking = true;
  requestAnimationFrame(() => { const y = window.scrollY; if (y < window.innerHeight) $('heroBg').style.transform = `translateY(${y * 0.3}px)`; ticking = false; });
}, { passive: true });
const _render = renderStatic;
renderStatic = function () { _render(); requestAnimationFrame(observe); };

boot();
</script>
</body>
